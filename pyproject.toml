[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffsplines"
version = "0.0.1"
authors = [{ name="Sam Williams", email="samwilliams@usc.edu" }]
description = "Torch implementation of various splines for differentiating"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project-urls]
Homepage = "https://github.com/sjwil/diffsplines"
Issues = "https://github.com/sjwil/diffsplines/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/spline"]